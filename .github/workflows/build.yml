name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web3d-build/package-lock.json
      - name: Construir renderizador incorporado
        working-directory: web3d-build
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Conferir renderizador incluído
        run: git diff --exit-code -- avatarcam/web3d/viewer.js
      - name: Construir aplicativo Windows
        run: python -m PyInstaller --noconfirm --clean 2DCam.spec
      - name: Gerar EXE único
        run: python scripts/build_standalone.py
